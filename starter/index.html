<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irodafoglaló</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  Ha valaki DUPLA KATTINTASSAL nyitja meg ezt a fajlt, a bongeszo file://
  cimen tolti be, ES modult pedig onnan nem tolt be (CORS). Az eredmeny egy
  nema, ures lap. Ezert szolunk elore.
-->
<div id="fileWarn" hidden>
  <h1>Így nem fog elindulni</h1>
  <p>Ezt a lapot <b>kiszolgálóról</b> kell megnyitni, nem dupla kattintással.
     A böngésző a <code>file://</code> címről nem tölt be JavaScript modult.</p>
  <p>Zárd be ezt az ablakot, és indítsd az <b>INDITAS.cmd</b> fájllal.</p>
</div>

<canvas id="jatek" width="1280" height="720"></canvas>

<script>
  // Ez a guard direkt sima szkript, nem modul: modulkent el sem indulna.
  if (location.protocol === 'file:') {
    document.getElementById('fileWarn').hidden = false;
    document.getElementById('jatek').hidden = true;
  }
</script>
<script type="module" src="src/jatek.js"></script>
</body>
</html>
